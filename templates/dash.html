<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/dash.css') }}">
</head>
<body>
    <!-- Main Container -->
    <div class="container-fluid">
        <div class="row">
            <!-- Vertical Navigation -->
            <nav class="col-md-2 d-none d-md-block bg-light sidebar">
                <div class="sidebar-sticky">
                    <h2 class="logo text-center py-3">STMS</h2>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active" href="#" onclick="window.location.href='/auth/home/'">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" onclick="window.location.href='/dash/'">Dashboard</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" onclick="window.location.href='/report/'">Reports</a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="col-md-10 ms-sm-auto px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center py-3 mb-3 border-bottom">
                    <h1 class="h2">Signal Info</h1>
                </div>

                <!-- Graph Section -->
                <div class="col-md-10 main-content">
                    <h5>Latest Traffic Signal Data</h5>
                    <div class="row">
                        <div class="col-md-12">
                            <div class="signal-box" id="latest-signal">
                                <h6>Latest Signal Data</h6>
                                <ul>
                                    <li>Car Count: 0</li>
                                    <li>Truck Count: 0</li>
                                    <li>Motorbike Count: 0</li>
                                    <li>Bus Count: 0</li>
                                    <li>Ambulance Count: 0</li>
                                    <li>Total Count: 0</li>
                                    <li><b>Current Signal ID: 0</b></li>
                                </ul>
                                <p>Timer: <span id="timer">0</span> seconds</p>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        function updateSignalData() {
            $.getJSON('/dash/api/latest-signal', function(data) {
                if (data && Object.keys(data).length > 0) {
                    // Update vehicle counts and last_signal_id
                    var box = $('#latest-signal');
                    box.find('li:eq(0)').text('Car Count: ' + (data.total_car || 0));
                    box.find('li:eq(1)').text('Truck Count: ' + (data.total_truck || 0));
                    box.find('li:eq(2)').text('Motorbike Count: ' + (data.total_motorbike || 0));
                    box.find('li:eq(3)').text('Bus Count: ' + (data.total_bus || 0));
                    box.find('li:eq(4)').text('Ambulance Count: 0'); // No ambulance data
                    box.find('li:eq(5)').text('Total Count: ' + (data.total_vehicle || 0));
                    box.find('li:eq(6)').html('<b>Current Signal ID: ' + (data.last_signal_id || 0) + '</b>');

                    // Update timer display
                    var time = data.time !== undefined && data.time > 0 ? data.time : 10; // Default to 10 if invalid
                    $('#timer').text(time);

                    // Schedule the next update based on data.time (in seconds)
                    var refreshInterval = time * 1000; // Convert seconds to milliseconds
                    console.log('Next refresh in: ' + refreshInterval + 'ms'); // Debugging
                    setTimeout(updateSignalData, refreshInterval);
                } else {
                    console.log('No data received, retrying in 10 seconds');
                    setTimeout(updateSignalData, 10000); // Default retry
                }
            }).fail(function(jqXHR, textStatus, errorThrown) {
                console.error('API call failed: ' + textStatus + ', ' + errorThrown);
                setTimeout(updateSignalData, 10000); // Retry after failure
            });
        }

        // Load data initially
        updateSignalData();
    </script>
</body>
</html>
