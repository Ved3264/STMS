<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}">
</head>
<body>
    <!-- Main Container -->
    <div class="container-fluid">
        <div class="row">
            <!-- Vertical Navigation -->
            <nav class="col-md-2 d-none d-md-block bg-light sidebar">
                <div class="sidebar-sticky">
                    <h2 class="logo text-center py-3">STMS</h2>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active" href="#" onclick="window.location.href='/auth/home/'">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#"  onclick="window.location.href='/dash/'" >Dashboard</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" onclick="window.location.href='/report/'"> Reports</a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="col-md-10 ms-sm-auto px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center py-3 mb-3 border-bottom">
                    <h1 class="h2">Welcome to STMS</h1>
                </div>

                <!-- Graph Section -->
                <div class="row">
                    <div class="col-md-6 mb-4">
                        <div class="graph-container">
                            <canvas id="chart1"></canvas>
                        </div>
                    </div>
                    <div class="col-md-6 mb-4">
                        <div class="graph-container">
                            <canvas id="chart2"></canvas>
                        </div>
                    </div>
                    <div class="col-md-6 mb-4">
                        <div class="graph-container">
                            <canvas id="chart3"></canvas>
                        </div>
                    </div>
                    <div class="col-md-6 mb-4">
                        <div class="graph-container">
                            <canvas id="chart4"></canvas>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../static/js/script.js"></script>
       
</body>
</html>
